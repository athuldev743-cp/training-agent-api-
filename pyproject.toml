[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-agent-api"
version = "1.0.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi[standard]==0.143.1",
    "fastapi-cli",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "langgraph>=0.2,<2.0",
    "fastembed>=0.7,<1.0",
]

[project.optional-dependencies]
ingestion = [
    "pypdf>=5.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "rag*", "data*", "agent*", "state*", "engine*", "nutrition_ingestion*", "services*"]

[tool.fastapi]
entrypoint = "api.app:app"
