[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-agent-api"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]==0.143.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "rag*", "data*", "agent*", "state*", "engine*"]

[tool.fastapi]
entrypoint = "api.app:app"
