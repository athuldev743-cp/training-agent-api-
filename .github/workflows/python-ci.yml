name: Python CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install application and ingestion test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ingestion]"
          python -m pip install pytest

      - name: Compile application packages
        run: python -m compileall -q agent api engine rag state nutrition_ingestion

      - name: Import FastAPI application
        run: python -c "from api.app import app; assert app is not None; print(app.title)"

      - name: Run tests
        run: python -m pytest -q
