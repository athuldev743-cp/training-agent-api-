name: Python CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install application and ingestion test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ingestion,test]"

      - name: Compile application packages
        run: python -m compileall -q agent api engine rag state nutrition_ingestion services evaluation scripts

      - name: Import FastAPI application
        run: |
          python -c 'from api.app import app; import agent.nutrition, agent.orchestrator, rag.nutrition_retrieval; assert app is not None; print(app.title); print("production agent imports: ok")'
          python -c 'from services.nutrition_reranker.app import app; assert app is not None; print("reranker service import: ok")'

      - name: Run tests
        run: |
          mkdir -p artifacts/module-4 artifacts/module-5 artifacts/module-7
          python -m pytest -q --junitxml=artifacts/module-7/pytest-junit.xml --cov=agent --cov=api --cov=engine --cov=rag --cov=state --cov=nutrition_ingestion --cov=services --cov=evaluation --cov-report=term-missing:skip-covered --cov-report=xml:artifacts/module-7/coverage.xml
          cp artifacts/module-7/pytest-junit.xml artifacts/module-4/pytest-junit.xml
          cp artifacts/module-7/pytest-junit.xml artifacts/module-5/pytest-junit.xml

      - name: Generate long-document and multi-page PDF fixtures
        if: matrix.python-version == '3.13'
        run: python scripts/create_nutrition_stress_fixtures.py

      - name: Generate Module 2 nutrition artifacts
        if: matrix.python-version == '3.13'
        run: |
          python -m nutrition_ingestion.cli \
            --input tests/fixtures/nutrition \
            --output artifacts/module-2/nutrition_chunks.jsonl
          python scripts/inspect_nutrition_artifact.py

      - name: Upload Module 2 artifacts
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: module-2-nutrition-inspection
          path: artifacts/module-2/
          if-no-files-found: error
          retention-days: 14
      - name: Generate Module 3 contract report
        if: matrix.python-version == '3.13'
        run: python scripts/report_module3_contract.py

      - name: Upload Module 3 evaluation artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: module-3-nutrition-contract-report
          path: artifacts/module-3/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Module 4 test report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: module-4-nutrition-agent-tests
          path: artifacts/module-4/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Module 5 test report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: module-5-orchestration-tests
          path: artifacts/module-5/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Module 7 evaluation and hardening test report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: module-7-evaluation-hardening-tests
          path: artifacts/module-7/
          if-no-files-found: error
          retention-days: 14
